apiVersion: apps/v1
kind: Deployment
metadata:
  name: msdemo-cartservice-deployment
  labels:
    app: msdemo-cartservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msdemo-cartservice
  template:
    metadata:
      labels:
        app: msdemo-cartservice
    spec:
      containers:
        - name: msdemo-cartservice-container
          image: 134448505602.dkr.ecr.ap-south-1.amazonaws.com/msdemo-cartservice:latest
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "7070"
            - name: DOTNET_EnableDiagnostics
              value: "0"
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          ports:
            - containerPort: 7070
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "300m"